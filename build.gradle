plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.91'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'alloy-forgery-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    owoInterfaceInjection { transitive = false }
}

var extractOwoInterfaceInjections = tasks.register('extractOwoInterfaceInjections', Copy) {
    from({ zipTree(configurations.owoInterfaceInjection.singleFile) }) { include 'interfaces.json' }
    into layout.buildDirectory.dir('owoInterfaceInjection')
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // src/main/resources/META-INF/accesstransformer.cfg is picked up automatically

    // Compile-time interface injection (Loom did this on Fabric via loom:injected_interfaces):
    //  - owo-lib's own data (AbstractWidget -> owo ComponentStub, ...)
    //  - Alloy Forgery's RecipeHolder -> RecipeTagHelper (implemented at runtime by mixin RecipeEntryMixin)
    interfaceInjectionData {
        from(extractOwoInterfaceInjections.map { it.destinationDir.toPath().resolve('interfaces.json').toFile() })
        from(file('interface_injection/alloyforgery.json'))
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Smoke test: the client must reach the title screen and exit by itself.
        // The mod reads -Dalloyforgery.port.exitOnTitle=true.
        clientSmoke {
            client()
            systemProperty 'alloyforgery.port.exitOnTitle', 'true'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources.srcDir 'src/main/generated'

repositories {
    maven { name = 'WispForest (owo-lib)'; url = 'https://maven.wispforest.io/releases' }
    maven { name = 'Sinytra (forgified-fabric-api, needed by owo-lib-neoforge)'; url = 'https://maven.su5ed.dev/releases' }
    mavenCentral()
}

dependencies {
    // owo-lib: official NeoForge build (same 0.12.x API as the Fabric original). Config is generated by its annotation processor.
    implementation "io.wispforest:owo-lib-neoforge:${owo_version}"
    annotationProcessor "io.wispforest:owo-lib-neoforge:${owo_version}"
    owoInterfaceInjection "io.wispforest:owo-lib-neoforge:${owo_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            owo_version            : owo_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '100000', '-Xmaxwarns', '0']
}

jar {
    from('LICENSE') { rename { "${it}_alloy-forgery" } }
}

// Mythic Metals port (../../mythic-metals/port) consumes this mod from mavenLocal:
//   ./gradlew publishToMavenLocal   ->   io.wispforest:alloy-forgery-neoforge:${mod_version}
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'alloy-forgery-neoforge'
            from components.java
        }
    }
}
